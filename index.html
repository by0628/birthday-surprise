<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
  <title>生日快樂，齐锐欣</title>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Style -->
  <link rel="stylesheet" href="./style/main.css" />
</head>

<body>
  <!-- Background Music -->
  <audio class="song" loop autoplay>
    <source src="">
    Your browser isn't invited for super fun audio time.
  </audio>

  <!-- Time-lock screen (shown before 2026-11-19 00:00 +08:00) -->
  <div id="lock-screen" hidden>
    <div class="lock-inner">
      <p class="lock-icon">🎁</p>
      <p class="lock-title">這份驚喜，還在路上</p>
      <p class="lock-sub">十一月十九日零點，為你揭曉</p>
      <p class="lock-count" id="lock-count"></p>
    </div>
  </div>

  <!-- All sections are rendered here dynamically from config.js -->
  <div class="container"></div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Config & Engine -->
  <script src="./config.js"></script>
  <script src="./script/main.js"></script>
</body>

</html>
